<script>
/* LOGOS DE BANNER: conservar el color original; los logos oscuros monocromos se muestran en blanco. */
function configurarLogoBanner(img, url){
  // TMDB puede servir logos sin cabeceras CORS: no usar canvas ni crossOrigin,
  // porque eso puede bloquear la propia imagen. Los logos oscuros ya llegan
  // convertidos a blanco desde el actualizador y conservan su transparencia.
  const logoUrl=String(url||'').trim()
    .replace('https://image.tmdb.org/pw780/','https://image.tmdb.org/t/p/w780/')
    .replace('https://image.tmdb.org/t/pw780/','https://image.tmdb.org/t/p/w780/')
    .replace('http://image.tmdb.org/pw780/','https://image.tmdb.org/t/p/w780/');
  img.onload=()=>{
    img.style.filter='drop-shadow(0 1px 2px rgba(0,0,0,.45))';
  };
  img.onerror=()=>{
    img.style.filter='none';
    img.dataset.logoError='true';
  };
  img.removeAttribute('crossorigin');
  img.src=logoUrl;
}

<script>
'use strict';

/* REPRODUCCION SEGURA: el enlace directo solo se solicita al iniciar */
const WORKER_URL = 'https://alldebrid-vlc.cristorodriguez13517.workers.dev/';
const TURNSTILE_SITE_KEY = '0x4AAAAAAGK-CFVW1ivlcFRe';
let turnstileWidgetId = null;
let turnstileResolve = null;
let turnstileReject = null;

async function generarTokenTurnstile(){
    const limite=Date.now()+15000;
    while(!window.turnstile&&Date.now()<limite) await new Promise(r=>setTimeout(r,100));
    if(!window.turnstile) throw new Error('No se pudo cargar la verificación anti-bots.');
    let host=document.getElementById('turnstile-container');
    if(!host){
        host=document.createElement('div');
        host.id='turnstile-container';
        host.style.cssText='position:fixed;right:12px;bottom:12px;z-index:3000;background:#fff;padding:4px;border-radius:6px';
        document.body.appendChild(host);
    }
    if(turnstileWidgetId===null){
        turnstileWidgetId=window.turnstile.render(host,{
            sitekey:TURNSTILE_SITE_KEY,action:'reproducir',execution:'execute',size:'invisible',appearance:'interaction-only',
            callback:token=>{if(turnstileResolve){const done=turnstileResolve;turnstileResolve=null;turnstileReject=null;done(token);}},
            'error-callback':code=>{console.error('Turnstile error:',code);if(turnstileReject){const fail=turnstileReject;turnstileResolve=null;turnstileReject=null;fail(new Error('Cloudflare Turnstile: error '+(code||'desconocido')+'. Revisa la Site Key y el dominio autorizado.'));}},
            'unsupported-callback':()=>{if(turnstileReject){const fail=turnstileReject;turnstileResolve=null;turnstileReject=null;fail(new Error('Este navegador no es compatible con la verificación de Cloudflare.'));}},
            'timeout-callback':()=>{if(turnstileReject){const fail=turnstileReject;turnstileResolve=null;turnstileReject=null;fail(new Error('Cloudflare agotó el tiempo de verificación.'));}},
            'expired-callback':()=>{if(turnstileReject){const fail=turnstileReject;turnstileResolve=null;turnstileReject=null;fail(new Error('La verificación caducó. Vuelve a intentarlo.'));}}
        });
    }
    return new Promise((resolve,reject)=>{
        turnstileResolve=resolve;turnstileReject=reject;
        window.turnstile.reset(turnstileWidgetId);
        window.turnstile.execute(turnstileWidgetId);
        setTimeout(()=>{
            if(turnstileReject===reject){turnstileResolve=null;turnstileReject=null;reject(new Error('La verificación está tardando demasiado. Vuelve a intentarlo.'));}
        },30000);
    });
}

let tokenTurnstileCache = '';
let tokenTurnstileAt = 0;
let tokenTurnstilePromise = null;
let reproduccionEnCurso = false;
const TOKEN_TURNSTILE_MAX_AGE = 210000;
const TOKEN_TURNSTILE_RENEW_AFTER = 150000;

function precalentarTokenTurnstile(){
    if(document.hidden) return Promise.resolve('');
    if(tokenTurnstileCache && Date.now()-tokenTurnstileAt < TOKEN_TURNSTILE_MAX_AGE) return Promise.resolve(tokenTurnstileCache);
    if(tokenTurnstilePromise) return tokenTurnstilePromise;
    tokenTurnstileCache = '';
    tokenTurnstileAt = 0;
    tokenTurnstilePromise = generarTokenTurnstile().then(token=>{
        if(typeof token !== 'string' || !token) throw new Error('Cloudflare no devolvió un token válido.');
        tokenTurnstileCache=token;
        tokenTurnstileAt=Date.now();
        return token;
    }).catch(error=>{
        console.warn('No se pudo anticipar la verificación; se solicitará al reproducir:',error);
        return '';
    }).finally(()=>{tokenTurnstilePromise=null;});
    return tokenTurnstilePromise;
}

async function obtenerTokenTurnstile(){
    if(tokenTurnstileCache && Date.now()-tokenTurnstileAt < TOKEN_TURNSTILE_MAX_AGE){
        const token=tokenTurnstileCache;
        tokenTurnstileCache='';
        tokenTurnstileAt=0;
        return token;
    }
    tokenTurnstileCache='';
    tokenTurnstileAt=0;
    return await precalentarTokenTurnstile() || await generarTokenTurnstile();
}

// Turnstile se solicita únicamente al reproducir o al iniciar una acción explícita.

async function reproducirConWorker(tipo,registro){
    if(reproduccionEnCurso) return;
    const magnetId=String(registro?.magnet_id||'');
    const filePath=String(registro?.file_path||'');
    if(!/^\d+$/.test(magnetId)||!filePath){alert('Este episodio no tiene un archivo disponible en AllDebrid.');return;}
    statusEl.hidden=false;
    statusEl.textContent='Verificando seguridad y preparando reproducción…';
    reproduccionEnCurso=true;
    try{
        const token=await obtenerTokenTurnstile();
        const response=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tipo,magnet_id:magnetId,file_path:filePath,token})});
        const result=await response.json().catch(()=>({}));
        if(!response.ok||!result.url) throw new Error(result.error||'No se pudo preparar la reproducción.');
        abrirVLC(result.url);
    }catch(error){console.error('Error de reproducción:',error);alert(error.message||'No se pudo iniciar la reproducción.');}
    finally{
        reproduccionEnCurso=false;
        statusEl.hidden=true;
        if(window.turnstile&&turnstileWidgetId!==null)window.turnstile.reset(turnstileWidgetId);
        }
}


const header=document.getElementById('header');
const headerInfo=document.getElementById('header-info');
const grid=document.getElementById('series-grid');
const container=document.getElementById('series-container');
const statusEl=document.getElementById('status');
const searchInput=document.getElementById('search');
const searchButton=document.getElementById('search-button');

const seriesId=new URLSearchParams(location.search).get('id');

let seriesList=[];
let selectedSeries=null;
let sharkVisibleSeries=null;
let sharkLastFocusedSeriesRow=-1;

let seasonRows=[];
let episodesBySeason=[];
let episodeRecords=[];
let currentSeasonIndex=0;
let currentEpisodeIndex=0;
let selectedEpisodeItem=null;
let sharkEpisodeInfoTimer=0;

/* LEER JSON */

async function readJson(file){
    const response=await fetch('./'+file+'?t='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw new Error(file+' HTTP '+response.status);
    return response.json();
}

function titleOf(s){
    return s.title_manual||s.title||s.name||'Serie';
}

function posterOf(s){
    return s.poster_manual||s.poster||'';
}

function logoOf(s){
    return s.logo_manual||s.logo||'';
}

function backdropOf(s){
    return s.backdrop_manual||s.backdrop||'';
}

function yearOf(s){
    return s.first_air_date?String(s.first_air_date).slice(0,4):'';
}

function genresOf(s){
    if(Array.isArray(s.genres)){
        return s.genres.map(x=>typeof x==='string'?x:x.name||'')
            .filter(Boolean).join(', ');
    }
    return s.genres||'';
}

function ageOf(s){
    let age=s.age_rating_manual||s.age_rating||'';
    if(age&&!String(age).endsWith('+'))age=String(age)+'+';
    return age;
}

function qualityOf(s){
    return s.quality_manual||s.quality||'';
}

/* ABRIR VLC */

function abrirVLC(url){
    if(!url){
        alert('Este episodio todavía no tiene enlace de reproducción.');
        return;
    }

    try{
        const media=new URL(url);

        if(media.protocol!=='https:'&&media.protocol!=='http:'){
            alert('El enlace de reproducción no es válido.');
            return;
        }

        const intent=
            'intent://'+media.host+media.pathname+media.search+
            '#Intent;scheme='+media.protocol.replace(':','')+
            ';package=org.videolan.vlc;type=video/*;end';

        window.location.href=intent;

    }catch(error){
        console.error(error);
        alert('No se pudo abrir el episodio en VLC.');
    }
}

/* CARGAR CATÁLOGO DE SERIES */

async function loadSeries(){
    try{
        const data=await readJson('series.json');

        if(!Array.isArray(data))throw new Error('series.json no es una lista');

        seriesList=data;
        renderSeries();

    }catch(error){
        console.error(error);
        statusEl.hidden=false;
        statusEl.textContent='No se pudo cargar series.json.';
    }
}

function renderSeries(){
    grid.replaceChildren();

    if(!seriesList.length){

        grid.appendChild(card);

        card.addEventListener('focus',()=>selectSeries(card));
        card.addEventListener('click',event=>{
            event.preventDefault();
            openSeries(card.dataset.id);
        });
    });

    filterSeries();
}


/* BUSCADOR: ignora tildes y busca por título, año, género y detalles */
function normalizarBusqueda(valor){
    return String(valor || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g,'')
        .toLocaleLowerCase('es')
        .trim();
}

function filterSeries(){
    const query=normalizarBusqueda(searchInput.value);
    const cards=[...grid.querySelectorAll('.movie')];
    let firstMatch=null;

    cards.forEach(card=>{
        const searchableText=normalizarBusqueda([
            card.dataset.title,
            card.dataset.year,
            card.dataset.genres,
            card.dataset.quality,
            card.dataset.age,
            card.dataset.overview,
            card.dataset.id
        ].join(' '));
        const matches=!query||searchableText.includes(query);
        card.hidden=!matches;
        if(matches&&!firstMatch)firstMatch=card;
    });

    sharkVisibleSeries=cards.filter(card=>!card.hidden);
    sharkLastFocusedSeriesRow=-1;

    if(selectedSeries)selectedSeries.classList.remove('selected');
    selectedSeries=null;
    if(firstMatch){
        statusEl.hidden=true;
    }else if(query){
        selectedSeries=null;
        if(headerInfo)headerInfo.replaceChildren();
        header.style.backgroundImage='none';
        statusEl.hidden=false;
        statusEl.textContent='No se han encontrado series.';
    }else{
        statusEl.hidden=cards.length===0;
        if(cards.length===0)statusEl.textContent='Todavía no hay series disponibles.';
    }
}

function updateCatalogViewport(card){
    const row=card&&card.closest('.movie-row');
    if(!row)return;
    const cards=Array.from(row.querySelectorAll('.movie:not([hidden])'));
    if(!cards.length)return;
    const first=cards[0];
    const rowHeight=first.getBoundingClientRect().height;
    row.style.setProperty('--shark-row-height',rowHeight+'px');
    row.style.height='var(--shark-row-height)';
    row.style.maxHeight='var(--shark-row-height)';
    row.style.overflowY='hidden';
    row.style.overflowX='visible';
    const columns=Math.max(1,getComputedStyle(row).gridTemplateColumns.split(' ').filter(Boolean).length);
    const index=cards.indexOf(card);
    if(index<0)return;
    const targetRow=Math.floor(index/columns);
    const offset=card.getBoundingClientRect().top-first.getBoundingClientRect().top;
    row.scrollTop=offset;
}
function selectSeries(card){
    if(!card || card.hidden)return;
    updateCatalogViewport(card);
    if(selectedSeries!==card){
        if(selectedSeries)selectedSeries.classList.remove('selected');
        selectedSeries=card;
        card.classList.add('selected');
    }

    clearTimeout(window.__sharkHeaderUpdateTimer);
    window.__sharkHeaderUpdateTimer=setTimeout(()=>{
        if(selectedSeries===card)renderSeriesHeader(card);

/* PREPARAR EPISODIOS Y TEMPORADAS */

function puntuacionCalidadEpisodio(ep){
    const texto=[ep.quality_manual,ep.quality,ep.file_path,ep.file_name,ep.filename,ep.source_name].filter(Boolean).join(' ').toLowerCase();
    if(/\b4k\b|2160p|uhd/.test(texto))return 4;
    if(/1080p|full[ ._-]?hd|\bfhd\b/.test(texto))return 3;
    if(/720p|\bhd\b/.test(texto))return 2;
    if(/480p|576p|sd/.test(texto))return 1;
    return 0;
}
function deduplicarEpisodios(lista){
    const elegidos=new Map();
    (lista||[]).forEach(ep=>{
        const key=String(ep.temporada||ep.season||1)+':'+String(ep.numero||ep.episodio||0);
        const anterior=elegidos.get(key);
        if(!anterior || puntuacionCalidadEpisodio(ep)>puntuacionCalidadEpisodio(anterior) ||
           (puntuacionCalidadEpisodio(ep)===puntuacionCalidadEpisodio(anterior) && !!(ep.url||ep.stream_url)>!!(anterior.url||anterior.stream_url))){
            elegidos.set(key,ep);
        }
    });
    return [...elegidos.values()];
}

function normalizarTemporadas(datos){
    if(!Array.isArray(datos))return [];

    /* Formato agrupado: [{numero:1, capitulos:[...]}] */
    if(datos.length&&Array.isArray(datos[0].capitulos)){
        return datos.slice().sort((a,b)=>Number(a.numero)-Number(b.numero));
    }

    /* Formato plano generado por el actualizador AllDebrid */
    const grupos={};

    datos=deduplicarEpisodios(datos);
    datos.forEach(ep=>{
        const temporada=Number(ep.temporada||ep.season||1);

        if(!grupos[temporada])grupos[temporada]=[];

        grupos[temporada].push({
            ...ep,
            numero:Number(ep.numero||ep.episodio||0)
        });
    });

    return Object.keys(grupos)
        .map(numero=>({
            numero:Number(numero),
            capitulos:grupos[numero].sort((a,b)=>a.numero-b.numero)
        }))
        .sort((a,b)=>a.numero-b.numero);
}

function crearTemporada(temporada,index){
    const row=document.createElement('div');
    row.className='season-row';
    row.dataset.seasonNumber=temporada.numero;

    const title=document.createElement('div');
    title.className='season-title';
    title.textContent='Temporada '+temporada.numero;

    const list=document.createElement('div');
    list.className='episodes-list';

    const eps=(temporada.capitulos||[]).slice()
        .sort((a,b)=>Number(a.numero)-Number(b.numero));

    eps.forEach((ep,epIndex)=>{
        const item=document.createElement('a');
        item.className='episode-thumb';
        item.href='#';
        item.tabIndex=0;
        item.dataset.season=String(index);
        item.dataset.episode=String(epIndex);

        const img=document.createElement('img');
        img.alt='';
        img.loading='lazy';
        img.draggable=false;

        if(ep.imagen){
            img.src=ep.imagen;
            img.onerror=()=>img.classList.add('placeholder');
        }else{
            img.classList.add('placeholder');
        }

        item.appendChild(img);

        item.addEventListener('focus',()=>{
            currentSeasonIndex=index;
            currentEpisodeIndex=epIndex;
            updateSelected();
        });

        item.addEventListener('click',event=>{
            event.preventDefault();
            currentSeasonIndex=index;
            currentEpisodeIndex=epIndex;
            updateSelected();
            reproducirConWorker('episode',ep);
        });

        list.appendChild(item);
    });

    row.append(title,list);
    container.appendChild(row);

    seasonRows.push(row);
    episodesBySeason.push([...list.querySelectorAll('.episode-thumb')]);
    episodeRecords.push(eps);
}

/* FICHA DEL EPISODIO */

function actualizarFicha(ep){
    const season=Number(
        seasonRows[currentSeasonIndex]?.dataset.seasonNumber||1
    );

    const numero=String(ep.numero||1).padStart(2,'0');

    const title=document.getElementById('episode-title');
    const overview=document.getElementById('episode-overview');

    if(title){
        title.textContent=
            'T'+season+' - E'+numero+' - '+(ep.titulo||'Capítulo '+numero);
    }

    if(overview){
        overview.textContent=
            ep.sinopsis||ep.overview||'Sin sinopsis disponible para este capítulo.';
    }
}

function updateSelected(){
    const item=(episodesBySeason[currentSeasonIndex]||[])[currentEpisodeIndex];
    const ep=(episodeRecords[currentSeasonIndex]||[])[currentEpisodeIndex];

    clearTimeout(sharkEpisodeInfoTimer);
    if(ep){
        sharkEpisodeInfoTimer=setTimeout(()=>{
            if((episodeRecords[currentSeasonIndex]||[])[currentEpisodeIndex]===ep)actualizarFicha(ep);
        },90);
    }

    if(item){
        if(selectedEpisodeItem!==item){
            if(selectedEpisodeItem)selectedEpisodeItem.classList.remove('selected');
            item.classList.add('selected');
            selectedEpisodeItem=item;
        }

        if(document.activeElement!==item)item.focus({preventScroll:true});

        const rect=item.getBoundingClientRect();
        const parent=item.parentElement;
        const bounds=parent ? parent.getBoundingClientRect() : null;
        if(bounds && (rect.left<bounds.left || rect.right>bounds.right)){
            item.scrollIntoView({block:'nearest',inline:'nearest',behavior:'instant'});
        }
    }
}

function mostrarTemporada(index){
    if(index<0||index>=seasonRows.length)return;

    seasonRows.forEach((row,i)=>{
        row.style.display=i===index?'block':'none';
    });

    currentSeasonIndex=index;
    currentEpisodeIndex=0;
    updateSelected();
}

function openCurrentEpisode(){
    const ep=(episodeRecords[currentSeasonIndex]||[])[currentEpisodeIndex];
    if(!ep)return;
    reproducirConWorker('episode',ep);
}

/* CARGAR DETALLE DE SERIE */

async function loadSeriesDetail(){
    try{
        const [series,episodeData]=await Promise.all([
            readJson('series.json'),
            readJson('episodios.json')
        ]);

        const serie=series.find(s=>
            String(s.id||s.tmdb_id)===String(seriesId)
        );

        if(!serie){
            statusEl.textContent='No se encontró la serie.';
            return;
        }

        header.style.backgroundImage=backdropOf(serie)
            ?'url("'+backdropOf(serie)+'")'
            :'none';

        headerInfo.replaceChildren();

        const logo=logoOf(serie);

        if(logo){
            const img=document.createElement('img');
            configurarLogoBanner(img,logo);
            img.alt=titleOf(serie);
            img.onerror=()=>{
                headerInfo.replaceChildren();
                const h=document.createElement('h1');
                h.textContent=titleOf(serie);
                headerInfo.appendChild(h);
            };
            headerInfo.appendChild(img);
        }else{
            const h=document.createElement('h1');
            h.textContent=titleOf(serie);
            headerInfo.appendChild(h);
        }

        const epTitle=document.createElement('h2');
        epTitle.className='episode-title';
        epTitle.id='episode-title';
        headerInfo.appendChild(epTitle);

        const overview=document.createElement('p');
        overview.className='overview';
        overview.id='episode-overview';
        overview.textContent=serie.overview||'';
        headerInfo.appendChild(overview);

        const temporadas=normalizarTemporadas(
            episodeData[String(serie.id||serie.tmdb_id)]||[]
        );

        grid.hidden=true;
        document.getElementById('search-container').hidden=true;
        container.replaceChildren();

        seasonRows=[];
        episodesBySeason=[];
        episodeRecords=[];

        temporadas.forEach((t,i)=>crearTemporada(t,i));

        if(!seasonRows.length){
            statusEl.hidden=false;
            statusEl.textContent='Todavía no hay episodios disponibles para esta serie.';
            return;
        }

        statusEl.hidden=true;
        mostrarTemporada(0);

    }catch(error){
        console.error(error);
        statusEl.hidden=false;
        statusEl.textContent='No se pudo cargar la serie. Comprueba los JSON.';
    }
}

function openSearch(){
    grid.querySelectorAll('.movie.selected').forEach(card=>card.classList.remove('selected'));
    selectedSeries=null;
    searchInput.classList.add('active');
    searchInput.focus();

    filterSeries();
    searchInput.classList.remove('active');

        searchInput.classList.remove('active');
    }
});

/* MANDO ANDROID TV */

document.addEventListener('keydown',event=>{
    const k=event.key;
    const c=event.keyCode||event.which;

    const up=k==='ArrowUp'||c===38||c===19;
    const down=k==='ArrowDown'||c===40||c===20;
    const left=k==='ArrowLeft'||c===37||c===21;
    const right=k==='ArrowRight'||c===39||c===22;
    const enter=k==='Enter'||c===13||c===23||c===66;
    const back=k==='Escape'||c===27||c===4;

    const active=document.activeElement;

    if(back){
        event.preventDefault();
        if(seriesId){
            location.href='index.html';
        }else{
            location.href='index.html';
        }
        return;
    }

    /* MODO CATÁLOGO */
    if(!seriesId){
        if(active===searchInput){
            if(up){
                event.preventDefault();
                searchButton.focus();
            }else if(down||enter){
                event.preventDefault();
                firstSeries();
            }
            return;
        }

        if(active===searchButton){
            if(enter){
                event.preventDefault();
                openSearch();
            }else if(down){
                event.preventDefault();
                firstSeries();
            }
            return;
        }

        const card=active.closest&&active.closest('.movie');

        if(!card){
            if(down||right){
                event.preventDefault();
                firstSeries();
            }else if(up||left){
                event.preventDefault();
                searchButton.focus();
            }
            return;
        }

        const cards=visibleSeries();
        const index=cards.indexOf(card);
        const cols=gridColumns();
        let next=index;

        if(enter){
            event.preventDefault();
            openSeries(card.dataset.id);
            return;
        }

        if(right)next=Math.min(index+1,cards.length-1);
        else if(left)next=index>0?index-1:index;
        else if(down)next=Math.min(index+cols,cards.length-1);
        else if(up){
            if(index<cols){
                event.preventDefault();
                searchButton.focus();
                return;
            }
            next=index-cols;
        }else return;

        event.preventDefault();
        focusSeries(cards[next]);
        return;
    }

    /* MODO DETALLE DE SERIE */
    if(!seasonRows.length)return;

    const current=episodesBySeason[currentSeasonIndex]||[];

    if(enter){
        event.preventDefault();
        openCurrentEpisode();
        return;
    }

    if(left||right){
        if(!current.length)return;

        event.preventDefault();
        currentEpisodeIndex=Math.max(
            0,
            Math.min(
                current.length-1,
                currentEpisodeIndex+(right?1:-1)
            )
        );
        updateSelected();
        return;
    }

    if(up||down){
        event.preventDefault();

        const next=currentSeasonIndex+(down?1:-1);

        if(next>=0&&next<seasonRows.length){
            mostrarTemporada(next);
        }
    }
},true);

/* INICIO */

async function iniciar(){
    if(seriesId){
        await loadSeriesDetail();
    }else{
        await loadSeries();
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
            const first=visibleSeries()[0];
            if(first)renderSeriesHeader(first);
        }));
    }
}

iniciar();

(function(){
 const mq=window.matchMedia('(max-width:600px) and (orientation:portrait)');
 let raf=0, observer=null, bound=new WeakSet();
 function getRows(){
  return Array.from(document.querySelectorAll('#movie-row, #series-grid, .movie-row'));
 }
 function getCards(){
  const rows=getRows();
  const cards=[];
  rows.forEach(row=>{
   Array.from(row.children).forEach(card=>{
    if(!cards.includes(card)) cards.push(card);
   });
  });
  return cards;
 }
 function getSynopsis(){
  return document.querySelector('#overview, .overview, #header-info .synopsis, #header-info .description, #header-info p, #header-info .description-text')
      || document.querySelector('#header-info');
 }
 function update(){
  raf=0;
  const cards=getCards();
  if(!mq.matches){
   cards.forEach(card=>{
    card.style.removeProperty('opacity');
    card.style.removeProperty('transition');
    card.style.removeProperty('pointer-events');
   });
   return;
  }
  const synopsis=getSynopsis();
  if(!synopsis)return;
  const boundary=synopsis.getBoundingClientRect().top;
  const fadeDistance=700;
  cards.forEach(card=>{
   const bottom=card.getBoundingClientRect().bottom;
   // La sinopsis fija su propio límite: el banner no participa en el cálculo.
   const opacity=Math.max(0,Math.min(1,(bottom-boundary)/fadeDistance));
   card.style.setProperty('transition','opacity .10s linear');
   card.style.setProperty('opacity',String(opacity),'important');
   card.style.setProperty('pointer-events',opacity<=0.01?'none':'auto');
  });
 }
 function request(){
  if(!raf)raf=requestAnimationFrame(update);
 }
 function bindScroll(){
  window.addEventListener('scroll',request,{passive:true,capture:true});
  document.addEventListener('scroll',request,{passive:true,capture:true});
  document.addEventListener('touchmove',request,{passive:true});
  if(window.visualViewport)window.visualViewport.addEventListener('scroll',request,{passive:true});
  getRows().forEach(row=>{
   if(!bound.has(row)){row.addEventListener('scroll',request,{passive:true});bound.add(row);}
  });
 }
 function init(){
  bindScroll();
  if(observer)observer.disconnect();
  observer=new MutationObserver(()=>{bindScroll();request();});
  observer.observe(document.body,{childList:true,subtree:true,characterData:true});
  if(window.ResizeObserver){
   const ro=new ResizeObserver(request);
   const synopsis=getSynopsis();
   if(synopsis)ro.observe(synopsis);
   getRows().forEach(row=>ro.observe(row));
  }
  request();
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});
 else init();
 if(mq.addEventListener)mq.addEventListener('change',request);
 else mq.addListener(request);
 window.addEventListener('resize',request,{passive:true});
})();
</script>
