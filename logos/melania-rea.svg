<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#e8e5e3"/>
      <stop offset="1" stop-color="#aaa5a3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g text-anchor="middle" filter="url(#shadow)">
    <text x="600" y="205" fill="url(#silver)" stroke="#292323" stroke-width="2" paint-order="stroke" font-family="Georgia, 'Times New Roman', serif" font-size="132" font-weight="bold" letter-spacing="7">MELANIA REA</text>
  </g>
  <path d="M275 255 H925" stroke="#8f2028" stroke-width="4" opacity=".95"/>
  <path d="M455 270 H745" stroke="#d7d0cc" stroke-width="1" opacity=".7"/>
  <circle cx="260" cy="255" r="4" fill="#a52a32"/>
  <circle cx="940" cy="255" r="4" fill="#a52a32"/>
</svg>