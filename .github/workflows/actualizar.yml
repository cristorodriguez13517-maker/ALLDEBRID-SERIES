name: Actualizar catalogo SHARKTV SERIES

on:
  workflow_dispatch:
  schedule:
    - cron: "27 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar sintaxis de Python
        run: python -m py_compile actualizar.py
      - name: Instalar dependencias
        run: pip install requests
      - name: Actualizar catalogo
        env:
          ALLDEBRID_API_KEY: ${{ secrets.ALLDEBRID_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python actualizar.py
      - name: Guardar cambios
        run: |
          git config user.name "SHARKTV"
          git config user.email "sharktv@users.noreply.github.com"
          git add series.json episodios.json
          git diff --cached --quiet || (
            git commit -m "Actualizar catalogo series"
            git push
          )
